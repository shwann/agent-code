name: agent-code

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3456
      SERVER_AUTH_TOKEN: ${SERVER_AUTH_TOKEN:?set SERVER_AUTH_TOKEN in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-600000}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-1}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:-1}
      SERVER_ENABLE_COMPUTER_USE: ${SERVER_ENABLE_COMPUTER_USE:-${VITE_ENABLE_COMPUTER_USE:-1}}
      VITE_ENABLE_COMPUTER_USE: ${VITE_ENABLE_COMPUTER_USE:-${SERVER_ENABLE_COMPUTER_USE:-1}}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - agent_code_data:/root/.claude
      - ${AGENT_CODE_WORKSPACE_DIR:-${CC_HAHA_WORKSPACE_DIR:-./workspace}}:/workspace
    expose:
      - "3456"

  adapters:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      ADAPTER_SERVER_URL: ws://app:3456
      SERVER_AUTH_TOKEN: ${SERVER_AUTH_TOKEN:?set SERVER_AUTH_TOKEN in .env}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - agent_code_data:/root/.claude
    depends_on:
      - app
    command: ["bun", "run", "desktop/sidecars/claude-sidecar.ts", "adapters", "--feishu"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SERVER_AUTH_TOKEN: ${SERVER_AUTH_TOKEN:?set SERVER_AUTH_TOKEN in .env}
    ports:
      - "${AGENT_CODE_HTTP_PORT:-${CC_HAHA_HTTP_PORT:-8080}}:80"

volumes:
  agent_code_data:
    name: agent-code-data




