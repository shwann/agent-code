name: agent-code

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3456
      SERVER_AUTH_TOKEN: ${SERVER_AUTH_TOKEN:?set SERVER_AUTH_TOKEN in .env}
      AGENT_CODE_RUN_USER: ${AGENT_CODE_RUN_USER:-agentcode}
      AGENT_CODE_UID: ${AGENT_CODE_UID:-1001}
      AGENT_CODE_GID: ${AGENT_CODE_GID:-1001}
      AGENT_CODE_HOME: ${AGENT_CODE_HOME:-/home/agentcode}
      AGENT_CODE_CHOWN_WORKSPACE: ${AGENT_CODE_CHOWN_WORKSPACE:-auto}
      HOME: ${AGENT_CODE_HOME:-/home/agentcode}
      CLAUDE_CONFIG_DIR: ${AGENT_CODE_HOME:-/home/agentcode}/.claude
      AGENT_CODE_WORKSPACE_DIR: /workspace
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-600000}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-1}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:-1}
      SERVER_ENABLE_COMPUTER_USE: ${SERVER_ENABLE_COMPUTER_USE:-${VITE_ENABLE_COMPUTER_USE:-1}}
      VITE_ENABLE_COMPUTER_USE: ${VITE_ENABLE_COMPUTER_USE:-${SERVER_ENABLE_COMPUTER_USE:-1}}
      AGENT_CODE_ENABLE_ADAPTERS: ${AGENT_CODE_ENABLE_ADAPTERS:-1}
      ADAPTER_SERVER_URL: ws://127.0.0.1:3456
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - agent_code_data:${AGENT_CODE_HOME:-/home/agentcode}/.claude
      - type: bind
        source: ${AGENT_CODE_HOST_WORKSPACE_DIR:-${AGENT_CODE_WORKSPACE_DIR:-${CC_HAHA_WORKSPACE_DIR:-./workspace}}}
        target: /workspace
        bind:
          create_host_path: true
    expose:
      - "3456"
    command: ["/usr/local/bin/agent-code-combined"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SERVER_AUTH_TOKEN: ${SERVER_AUTH_TOKEN:?set SERVER_AUTH_TOKEN in .env}
    ports:
      - "${AGENT_CODE_HTTP_PORT:-${CC_HAHA_HTTP_PORT:-19901}}:80"

volumes:
  agent_code_data:
    name: agent-code-data




